name: BSMInputMethod

options:
  bundleIdPrefix: hk.ignition.inputmethod
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

packages:
  BSMCore:
    path: .

targets:
  BSMInputMethod:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
      - path: Data/bsm.db
        buildPhase: resources
    dependencies:
      - package: BSMCore
        product: BSMCore
      - package: BSMCore
        product: BSMCandidateUI
      - package: BSMCore
        product: BSMDictionarySQLite
    settings:
      base:
        PRODUCT_NAME: BSMInputMethod
        PRODUCT_BUNDLE_IDENTIFIER: hk.ignition.inputmethod.BSMInputMethod
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"

  BSMExample:
    type: application
    platform: macOS
    sources:
      - path: Example
    dependencies:
      - package: BSMCore
        product: BSMCore
      - package: BSMCore
        product: BSMCandidateUI
    settings:
      base:
        PRODUCT_NAME: BSMExample
        PRODUCT_BUNDLE_IDENTIFIER: hk.ignition.inputmethod.BSMInputMethod.Example
        INFOPLIST_FILE: Example/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"

  BSMExampleUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ExampleUITests
    dependencies:
      - target: BSMExample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: hk.ignition.inputmethod.BSMInputMethod.ExampleUITests
        TEST_TARGET_NAME: BSMExample

schemes:
  BSMExample:
    build:
      targets:
        BSMExample: all
        BSMExampleUITests: [test]
    test:
      targets:
        - BSMExampleUITests
